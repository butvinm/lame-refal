name: Build and deploy examples

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang and wasm-ld
        run: sudo apt-get update && sudo apt-get install -y clang lld

      - name: Build examples
        run: make

      - name: Run smoke tests
        run: make test

      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r site _site/
          cp -r runtime _site/
          cp -r examples _site/
          rm -rf _site/runtime/include _site/runtime/lamelibc.c _site/runtime/stb_sprintf.h

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
