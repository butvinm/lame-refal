<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Interpolation — Refal in WASM</title>
    </head>
    <body>
        <div style="display: flex; flex-direction: row; gap: 20px">
            <textarea id="points" rows="12" placeholder="x0;y0&#10;x1;y1&#10;x2;y2">
-3.24;0.8
-0.88;3.77
1.5;3.47
5.7;8.02
7.52;9.75
</textarea
            >
            <div style="display: flex; flex-direction: column; gap: 20px; width: 200px">
                <button onclick="history.back()">Home</button>
                <button id="interpolateButton">Interpolate!</button>
                <button id="stopButton">Stoooooop!</button>
                <label>Lower bound:</label>
                <div style="display: flex; justify-content: space-between; align-items: center">
                    <input type="range" step="0.1" min="-10" max="0" value="-10" id="lowerSlider" />
                    <strong id="lowerView">-10</strong>
                </div>
                <label>Upper bound:</label>
                <div style="display: flex; justify-content: space-between; align-items: center">
                    <input type="range" step="0.1" min="0" max="10" value="10" id="upperSlider" />
                    <strong id="upperView">10</strong>
                </div>
            </div>
        </div>

        <canvas id="wasmCanvas" width="1000" height="1000" style="border: black solid 1px"></canvas>

        <script type="module">
            import { load } from "../../../runtime/lamehost.js";
            import { canvasHost } from "../canvas.js";

            const MILLISECONDS_IN_SECOND = 1000;
            const MAX_STEPS = 2000;

            const canvas = document.getElementById("wasmCanvas");
            const ctx = canvas.getContext("2d");
            const program = await load("./main.wasm", { hosts: [canvasHost(ctx)] });

            let lowerBound = -10;
            let upperBound = 10;
            let stop = false;
            let steps = MAX_STEPS;
            let start;

            function next(timestamp) {
                if (stop || steps-- === 0) {
                    console.log("Stopped");
                    return;
                }

                const ts = (timestamp - start) / MILLISECONDS_IN_SECOND;
                if (ts > upperBound) {
                    console.log("Reached upper bound");
                    return;
                }

                program.run([ts, document.getElementById("points").value]);
                window.requestAnimationFrame(next);
            }

            function interpolate() {
                stop = false;
                steps = MAX_STEPS;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                window.requestAnimationFrame((timestamp) => {
                    start = timestamp - lowerBound * MILLISECONDS_IN_SECOND;
                    window.requestAnimationFrame(next);
                });
            }

            document.getElementById("interpolateButton").addEventListener("click", interpolate);

            document.getElementById("stopButton").addEventListener("click", () => {
                stop = true;
            });

            const lowerView = document.getElementById("lowerView");
            document.getElementById("lowerSlider").addEventListener("input", (event) => {
                lowerBound = Number(event.target.value);
                lowerView.innerHTML = lowerBound;
            });

            const upperView = document.getElementById("upperView");
            document.getElementById("upperSlider").addEventListener("input", (event) => {
                upperBound = Number(event.target.value);
                upperView.innerHTML = upperBound;
            });
        </script>
    </body>
</html>
