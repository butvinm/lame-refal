<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>lgbtqia2s+ — Refal in WASM</title>
    </head>
    <body>
        <button onclick="history.back()">Home</button>
        <button id="stopButton">Stoooooop!</button>

        <canvas id="wasmCanvas" width="1000" height="1000"></canvas>

        <script type="module">
            import { load } from "../../runtime/lamehost.js";
            import { canvasEnv } from "../canvas.js";

            const ctx = document.getElementById("wasmCanvas").getContext("2d");
            const program = await load("./main.wasm", { env: [canvasEnv(ctx)] });

            let stop = false;

            function frame(timestamp) {
                if (stop) {
                    console.log("Stopped");
                    return;
                }

                program.run([Math.ceil(timestamp)]);
                window.requestAnimationFrame(frame);
            }

            document.getElementById("stopButton").addEventListener("click", () => {
                stop = true;
            });

            window.requestAnimationFrame(frame);
        </script>
    </body>
</html>
